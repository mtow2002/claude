# ---------------------------------------------------------------------------
# pyproject.toml : the single file that describes this Python project.
#
# pip reads it when you run  `pip install -e ".[dev]"`  from the folder that
# contains it. "-e" means "editable": Python imports the code straight from
# src/, so edits take effect without reinstalling.
# ---------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-review"
version = "0.1.0"
description = "Reproducible, point-in-time quantitative stock and ETF portfolio review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Matt Tow" }]

# Runtime dependencies. Versions are lower bounds; pip picks the newest that
# satisfies them. pandas 2.2+ is required because we use the "ME"/"QE"
# resample aliases that older pandas does not understand.
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "requests>=2.31",
  "yfinance>=0.2.40",
  "pyarrow>=15.0",
]

# Optional dependency groups. Install one with  pip install -e ".[name]".
# These are pre-declared so later work (BigQuery store, HTML report,
# backtesting) never needs to edit this file.
[project.optional-dependencies]
dev = ["pytest>=8.0"]
bigquery = ["google-cloud-bigquery>=3.20", "db-dtypes>=1.2"]
report = ["matplotlib>=3.8", "jinja2>=3.1"]
backtest = []
all = [
  "pytest>=8.0",
  "google-cloud-bigquery>=3.20",
  "db-dtypes>=1.2",
  "matplotlib>=3.8",
  "jinja2>=3.1",
]

# The console script: after installing, typing `portfolio-review` in a
# terminal calls the function `main` inside src/portfolio_review/cli.py.
[project.scripts]
portfolio-review = "portfolio_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
